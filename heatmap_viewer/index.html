<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Heatmaps</title>
<style>
  :root {
    --bg: #111111;
    --panel: #1c1c1c;
    --border: #2c2c2c;
    --text: #ececec;
    --muted: #8c8c8c;
    --line: rgba(255, 255, 255, 0.2);
    --c1: #22b466; /* count 1 – green  */
    --c2: #f2d13a; /* count 2 – yellow */
    --c3: #f28e2b; /* count 3 – orange */
    --c4: #e3342f; /* count 4+ – red   */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px;
  }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--muted); margin: 0 0 20px; }

  .controls {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  select, input, button {
    font: inherit;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
  }
  button { cursor: pointer; }
  button[disabled] { opacity: 0.4; cursor: default; }
  button[disabled]:hover { border-color: var(--border); }

  .search { position: relative; display: flex; flex-direction: column; gap: 4px; }
  .search label { display: block; }
  .suggestions {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 10;
    margin: 4px 0 0; padding: 4px; list-style: none;
    background: #242424; border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    max-height: 320px; overflow-y: auto;
  }
  .suggestions li { padding: 7px 10px; border-radius: 6px; cursor: pointer; }
  .suggestions li[aria-selected="true"] { background: #333; }
  .suggestions .s-name { color: var(--text); }
  .suggestions .s-meta { color: var(--muted); font-size: 12px; }
  .suggestions .s-empty { color: var(--muted); cursor: default; }
  button:hover { border-color: var(--muted); }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .player-name { font-size: 22px; font-weight: 600; }
  .player-meta { color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }

  .toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .toggle button { border: 0; border-radius: 0; background: transparent; color: var(--muted); }
  .toggle button[aria-pressed="true"] { background: #2e2e2e; color: var(--text); }

  .stats { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 12px; }
  .stat .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .ramp {
    width: 140px; height: 8px; border-radius: 4px;
    background: linear-gradient(90deg, transparent, var(--c1) 30%, var(--c2) 55%, var(--c3) 75%, var(--c4));
  }

  .pitch-wrap { overflow-x: auto; }
  svg.pitch { display: block; width: 100%; min-width: 520px; height: auto; }
  .direction { text-align: center; color: var(--muted); font-size: 12px; margin-top: 6px; }

  .similar { margin-top: 16px; }
  .similar-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .similar h2 { font-size: 16px; font-weight: 600; margin: 0 0 2px; }
  .similar-sub { color: var(--muted); font-size: 12px; margin: 0 0 14px; max-width: 60ch; }
  .similar-sub a { color: inherit; }
  .similar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .sim-card {
    display: flex; flex-direction: column; gap: 6px; text-align: left;
    background: #202020; border: 1px solid var(--border); border-radius: 8px; padding: 10px;
  }
  .sim-card:hover { border-color: var(--muted); }
  .sim-card svg { display: block; width: 100%; height: auto; }
  .sim-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .sim-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sim-score { font-variant-numeric: tabular-nums; color: var(--c1); font-weight: 600; }
  .sim-meta { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .similar-empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Player Heatmaps</h1>
  <p class="sub">Players with 1000+ minutes, 23/24 through 25/26.</p>

  <div class="controls">
    <div class="search">
      <label for="search">Search player</label>
      <input id="search" type="search" placeholder="name, namesurname, club or season" autocomplete="off"
             role="combobox" aria-expanded="false" aria-controls="suggestions" aria-autocomplete="list">
      <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
    </div>
    <label>League <select id="league"></select></label>
    <label>Team <select id="team"></select></label>
    <label>Season <select id="season"></select></label>
    <label>Player <select id="player"></select></label>
  </div>

  <div class="card">
    <div class="head">
      <div>
        <div class="player-name" id="name">–</div>
        <div class="player-meta" id="meta"></div>
      </div>
      <div class="actions">
        <div class="toggle" role="group" aria-label="View">
          <button id="mode-blur" data-mode="blur" title="Smoothed density, 2.5 m">Blur</button>
          <button id="mode-points" data-mode="points" title="Every recorded cell, coloured by touch count">Points</button>
        </div>
        <button id="prev" title="Back to the player you were just on (←)">← Back</button>
        <button id="next" title="Forward again (→)">Forward →</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="legend" id="legend"></div>
    <div class="pitch-wrap">
      <svg class="pitch" id="pitch" viewBox="-3 -3 111 74" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="direction">Attacking direction →</div>
  </div>

  <section class="card similar">
    <div class="similar-head">
      <div>
        <h2>Most similar heatmaps</h2>
        <p class="similar-sub" id="similar-sub"></p>
      </div>
      <div class="toggle" role="group" aria-label="Comparison method">
        <!-- the value stays "cells" because that is what the comparison reads; the
             label says Blur because that is how these matches are drawn -->
        <button id="method-cells" data-method="cells" title="Compare all 101 × 101 cells directly, shown blurred">Blur</button>
        <button id="method-zones" data-method="zones" title="Compare the 22 mirrored zones, per m²">Zones</button>
      </div>
    </div>
    <div class="similar-grid" id="similar"></div>
  </section>
</main>

<script>
const LEAGUES = {
  premierleague: "Premier League",
  laliga: "La Liga",
  seriea: "Serie A",
  bundesliga: "Bundesliga",
  ligue1: "Ligue 1",
  superlig: "Süper Lig",
};
const PITCH_W = 105, PITCH_H = 68, GRID = 101; // data coords are 0–100 inclusive
const SVG_NS = "http://www.w3.org/2000/svg";

// Blur view: density raster at 5 px per metre, Gaussian blob per point.
// It is a way of looking only — no comparison ever uses the blurred values.
const HEAT_W = 525, HEAT_H = 340;
const SIGMA_M = 2.5;
const HEAT_PERCENTILE = 0.99;

const COLOR_VARS = ["--c1", "--c2", "--c3", "--c4"];

// How the matches are found, and how their thumbnails are drawn. Separate from
// the map view above: looking at a season and comparing two are different jobs.
const METHODS = {
  zones: "22 zones, compared per m²: the whole defensive third is one zone, everywhere else is mirrored left/right and finer towards goal. Sharper for attacking players, near-identical for most defenders.",
  cells: "All 101 × 101 grid cells compared directly, every square metre counting the same. Raw cells rarely coincide, so a strong match scores around 20%.",
};

const $ = (id) => document.getElementById(id);
const titleCase = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const leagueName = (l) => LEAGUES[l] || titleCase(l);
const playerName = (p) => `${p.first_name} ${p.last_name}`.trim() || titleCase(p.player);
const normalize = (s) => s.normalize("NFD").replace(/[\u0300-\u036f']/g, "").toLowerCase();
const cssColor = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

let players = [];
let playersById = new Map();
let filtered = [];
let current = null; // { player, points }
let mode = "blur";     // blur | points — the map on the player card
let method = "zones";  // zones | cells — how the matches below are found
try {
  const m = localStorage.getItem("heatmap-mode"), c = localStorage.getItem("similar-method");
  if (m === "blur" || m === "points") mode = m;
  if (METHODS[c]) method = c;
} catch {}
let zoneDefs = null;   // filled from /api/zones

function setOptions(select, values, labelFn, allLabel) {
  const prev = select.value;
  select.innerHTML = "";
  if (allLabel) select.add(new Option(allLabel, ""));
  for (const v of values) select.add(new Option(labelFn(v), v));
  if ([...select.options].some((o) => o.value === prev)) select.value = prev;
}

// `selected` (optional): a player to jump to — league/team/season filters follow it
function refreshFilters(selected) {
  if (selected) $("league").value = selected.league;
  const league = $("league").value;
  const teamNames = new Map(players.filter((p) => !league || p.league === league).map((p) => [p.team, p.team_name]));
  const teams = [...teamNames.keys()].sort((a, b) => teamNames.get(a).localeCompare(teamNames.get(b)));
  setOptions($("team"), teams, (t) => teamNames.get(t), "All teams");
  if (selected) $("team").value = selected.team;
  const team = $("team").value;
  if (selected) $("season").value = selected.season;
  const season = $("season").value;

  filtered = players.filter((p) => (!league || p.league === league) && (!team || p.team === team)
    && (!season || p.season === season));
  setOptions($("player"), filtered.map((p) => p.file),
    (f) => { const p = filtered.find((x) => x.file === f); return `${playerName(p)} (${p.team_name}) · ${p.season_label}`; });
  const file = selected?.file || $("player").value || filtered[0]?.file;
  if (file) loadPlayer(file);
  else showStatus("No players match.");
}

// --- search autocomplete ---
const MAX_SUGGESTIONS = 10;
let suggestions = [];
let activeSuggestion = -1;

function searchPlayers(query) {
  // Every typed word must appear somewhere in the player's haystack — their
  // name, their raw "namesurname" slug, their club, league and season. So
  // "de bruyne" and "saka" still work, and so do "ardaguler", "sunderland
  // 25/26" and "kane spurs", which is the only way to reach a player whose
  // name we couldn't recover from the slug.
  const words = normalize(query).split(/[^a-z0-9]+/).filter(Boolean);
  if (!words.length) return [];
  // Someone whose name *starts* with what you typed beats someone who merely
  // contains it, who in turn beats a match on club or season — otherwise
  // "saka" answers Melihkabasakal before Bukayo Saka.
  const rank = (p) => {
    const w = words[0];
    if (p.searchName.split(" ").some((part) => part.startsWith(w))) return 0;
    if (p.searchName.includes(w)) return 1;
    return 2;
  };
  return players
    .filter((p) => words.every((w) => p.searchText.includes(w)))
    .sort((a, b) => rank(a) - rank(b))
    .slice(0, MAX_SUGGESTIONS);
}

function renderSuggestions() {
  const list = $("suggestions");
  const query = $("search").value.trim();
  suggestions = searchPlayers(query);
  activeSuggestion = suggestions.length ? 0 : -1;
  list.innerHTML = "";
  if (!query) return closeSuggestions();
  if (!suggestions.length) {
    list.innerHTML = `<li class="s-empty">No players found</li>`;
  }
  suggestions.forEach((p, i) => {
    const li = document.createElement("li");
    li.role = "option";
    li.id = `suggestion-${i}`;
    li.innerHTML = `<div class="s-name"></div><div class="s-meta"></div>`;
    li.querySelector(".s-name").textContent = playerName(p);
    li.querySelector(".s-meta").textContent = `${p.team_name} · ${leagueName(p.league)} · ${p.season_label}`;
    // mousedown (not click) so the input's blur doesn't close the list first
    li.addEventListener("mousedown", (e) => { e.preventDefault(); chooseSuggestion(i); });
    li.addEventListener("mousemove", () => highlightSuggestion(i));
    list.appendChild(li);
  });
  list.hidden = false;
  $("search").setAttribute("aria-expanded", "true");
  highlightSuggestion(activeSuggestion);
}

function highlightSuggestion(i) {
  activeSuggestion = i;
  [...$("suggestions").children].forEach((li, j) => li.setAttribute("aria-selected", j === i));
  const active = $(`suggestion-${i}`);
  if (active) {
    active.scrollIntoView({ block: "nearest" });
    $("search").setAttribute("aria-activedescendant", active.id);
  }
}

function closeSuggestions() {
  $("suggestions").hidden = true;
  $("search").setAttribute("aria-expanded", "false");
  $("search").removeAttribute("aria-activedescendant");
}

function chooseSuggestion(i) {
  const p = suggestions[i];
  if (!p) return;
  $("search").value = playerName(p);
  closeSuggestions();
  refreshFilters(p);
}

function onSearchKeydown(e) {
  const open = !$("suggestions").hidden;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (!open) return renderSuggestions();
    if (!suggestions.length) return;
    const dir = e.key === "ArrowDown" ? 1 : -1;
    highlightSuggestion((activeSuggestion + dir + suggestions.length) % suggestions.length);
  } else if (e.key === "Enter" && open) {
    e.preventDefault();
    chooseSuggestion(activeSuggestion);
  } else if (e.key === "Escape") {
    closeSuggestions();
  }
}

function el(tag, attrs, parent) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  parent.appendChild(node);
  return node;
}

let clipCount = 0;
function drawPitch(svg = $("pitch")) {
  svg.innerHTML = "";
  const clipId = `pitch-clip-${++clipCount}`;
  const clip = el("clipPath", { id: clipId }, el("defs", {}, svg));
  el("rect", { x: 0, y: 0, width: PITCH_W, height: PITCH_H, rx: 1.5 }, clip);
  const heat = el("g", { "clip-path": `url(#${clipId})` }, svg);

  const lines = el("g", { fill: "none", stroke: "var(--line)", "stroke-width": 0.35 }, svg);
  const midY = PITCH_H / 2;
  el("rect", { x: 0, y: 0, width: PITCH_W, height: PITCH_H, rx: 1.5 }, lines);
  el("line", { x1: PITCH_W / 2, y1: 0, x2: PITCH_W / 2, y2: PITCH_H }, lines);
  el("circle", { cx: PITCH_W / 2, cy: midY, r: 9.15 }, lines);
  for (const side of [0, 1]) {
    const x = (d) => (side ? PITCH_W - d : d);
    const box = (depth, width) =>
      el("rect", { x: Math.min(x(0), x(depth)), y: midY - width / 2, width: depth, height: width }, lines);
    box(16.5, 40.32);
    box(5.5, 18.32);
    // penalty arc: part of 9.15m circle around the spot outside the box
    const dy = Math.sqrt(9.15 ** 2 - 5.5 ** 2);
    el("path", { d: `M ${x(16.5)} ${midY - dy} A 9.15 9.15 0 0 ${side ? 0 : 1} ${x(16.5)} ${midY + dy}` }, lines);
  }
  return heat;
}

function showStatus(msg) {
  current = null;
  $("name").textContent = "–";
  $("meta").textContent = "";
  $("stats").innerHTML = "";
  drawPitch();
  el("text", { x: PITCH_W / 2, y: PITCH_H / 2, "text-anchor": "middle", fill: "var(--muted)", "font-size": 3 }, $("pitch"))
    .textContent = msg;
}

// y=0 is the player's right touchline; attacking left→right puts it at the bottom
const toPitchX = (x) => (x / GRID) * PITCH_W;
const toPitchY = (y) => ((100 - y) / GRID) * PITCH_H;

function drawPoints(heat, points) {
  const cw = PITCH_W / GRID, ch = PITCH_H / GRID;
  const frag = document.createDocumentFragment();
  // draw low counts first so the busiest cells sit on top
  for (const p of [...points].sort((a, b) => a.count - b.count)) {
    const r = document.createElementNS(SVG_NS, "rect");
    r.setAttribute("x", toPitchX(p.x));
    r.setAttribute("y", toPitchY(p.y));
    r.setAttribute("width", cw);
    r.setAttribute("height", ch);
    r.setAttribute("fill", `var(${COLOR_VARS[Math.min(p.count, 4) - 1]})`);
    const t = document.createElementNS(SVG_NS, "title");
    t.textContent = `x ${p.x}, y ${p.y} · ${p.count} touch${p.count > 1 ? "es" : ""}`;
    r.appendChild(t);
    frag.appendChild(r);
  }
  heat.appendChild(frag);
}

// Same maths the comparison uses: sum counts per GROUP (several rectangles can
// share one group -- the whole defensive third, or a mirrored L/R pair), then
// divide by the group's area so a 118 m² attacking slice isn't drowned by the
// 3570 m² defensive block.
function zoneDensities(points) {
  const nGroups = 1 + Math.max(...zoneDefs.map((z) => z.group_index));
  const totals = new Array(nGroups).fill(0);
  for (const p of points) {
    const xm = ((p.x + 0.5) / GRID) * PITCH_W, ym = ((p.y + 0.5) / GRID) * PITCH_H;
    const z = zoneDefs.find((z) => xm >= z.x0 && xm < z.x1 && ym >= z.y0 && ym < z.y1);
    if (z) totals[z.group_index] += p.count;
  }
  const sum = totals.reduce((a, b) => a + b, 0) || 1;
  // one entry per physical rectangle, reading its shared group's total --
  // both halves of a mirrored pair (or all 9 defensive rectangles) show the
  // same share/density, because that's the one number they're compared on
  return zoneDefs.map((z) => {
    const t = totals[z.group_index];
    return { share: t / sum, density: t / sum / z.group_area, touches: t };
  });
}

function drawZones(heat, points) {
  if (!zoneDefs) return;
  const vals = zoneDensities(points);
  const max = Math.max(...vals.map((v) => v.density)) || 1;
  const ramp = (rampCache ??= buildRamp());
  const frag = document.createDocumentFragment();
  zoneDefs.forEach((z, i) => {
    // linear: the ramp's own alpha fade keeps quiet zones dark, the way the blur view reads
    const t = vals[i].density / max;
    const o = Math.min(Math.round(t * 255), 255) * 4;
    const r = document.createElementNS(SVG_NS, "rect");
    r.setAttribute("x", z.x0);
    r.setAttribute("y", PITCH_H - z.y1);          // y = 0 is the player's right touchline
    r.setAttribute("width", z.x1 - z.x0);
    r.setAttribute("height", z.y1 - z.y0);
    r.setAttribute("fill", `rgb(${ramp[o]},${ramp[o + 1]},${ramp[o + 2]})`);
    r.setAttribute("fill-opacity", ramp[o + 3] / 255);
    r.setAttribute("stroke", "var(--panel)");
    r.setAttribute("stroke-width", 0.15);
    const title = document.createElementNS(SVG_NS, "title");
    title.textContent = `${z.group} · ${vals[i].touches} touches · ${(vals[i].share * 100).toFixed(1)}% of season · ${Math.round(z.group_area)} m²`;
    r.appendChild(title);
    frag.appendChild(r);
  });
  heat.appendChild(frag);
}

// 256-entry colour ramp: transparent → green → yellow → orange → red
function buildRamp() {
  const hex = (v) => cssColor(v).match(/\w\w/g).map((h) => parseInt(h, 16));
  const stops = [[0.0, hex("--c1")], [0.4, hex("--c1")], [0.6, hex("--c2")], [0.78, hex("--c3")], [0.95, hex("--c4")], [1, hex("--c4")]];
  const ramp = new Uint8ClampedArray(256 * 4);
  for (let i = 0; i < 256; i++) {
    const t = i / 255;
    const j = stops.findIndex(([s]) => s >= t);
    const [s1, c1] = stops[Math.max(j - 1, 0)], [s2, c2] = stops[j];
    const f = s2 === s1 ? 0 : (t - s1) / (s2 - s1);
    for (let k = 0; k < 3; k++) ramp[i * 4 + k] = c1[k] + (c2[k] - c1[k]) * f;
    // fade in low densities so sparse areas stay dark, like FotMob
    const a = Math.min(Math.max((t - 0.06) / 0.3, 0), 1);
    ramp[i * 4 + 3] = 235 * a * a * (3 - 2 * a);
  }
  return ramp;
}

let rampCache = null;
// `heatW`: raster width in px — smaller for thumbnails
function drawSmooth(heat, points, heatW = HEAT_W) {
  const HEAT_W = heatW, HEAT_H = Math.round((heatW * PITCH_H) / PITCH_W);
  const pxPerM = HEAT_W / PITCH_W;
  const sigma = SIGMA_M * pxPerM, r = Math.ceil(sigma * 3), size = 2 * r + 1;
  const kernel = new Float32Array(size * size);
  for (let dy = -r; dy <= r; dy++)
    for (let dx = -r; dx <= r; dx++)
      kernel[(dy + r) * size + dx + r] = Math.exp(-(dx * dx + dy * dy) / (2 * sigma * sigma));

  const field = new Float32Array(HEAT_W * HEAT_H);
  for (const p of points) {
    const cx = Math.round((toPitchX(p.x + 0.5) / PITCH_W) * HEAT_W);
    const cy = Math.round((toPitchY(p.y - 0.5) / PITCH_H) * HEAT_H);
    for (let dy = -r; dy <= r; dy++) {
      const py = cy + dy;
      if (py < 0 || py >= HEAT_H) continue;
      for (let dx = -r; dx <= r; dx++) {
        const px = cx + dx;
        if (px < 0 || px >= HEAT_W) continue;
        field[py * HEAT_W + px] += p.count * kernel[(dy + r) * size + dx + r];
      }
    }
  }

  // scale to a high percentile rather than the single hottest pixel, so one hotspot
  // doesn't wash out the rest of the map
  let peak = 0;
  for (const v of field) if (v > peak) peak = v;
  const active = field.filter((v) => v > peak * 0.02).sort();
  const max = active.length ? active[Math.floor(active.length * HEAT_PERCENTILE)] : 0;
  const ramp = (rampCache ??= buildRamp());
  const canvas = document.createElement("canvas");
  canvas.width = HEAT_W;
  canvas.height = HEAT_H;
  const ctx = canvas.getContext("2d");
  const img = ctx.createImageData(HEAT_W, HEAT_H);
  for (let i = 0; i < field.length; i++) {
    const idx = max ? Math.round(Math.min(field[i] / max, 1) * 255) * 4 : 0;
    img.data.set(ramp.subarray(idx, idx + 4), i * 4);
  }
  ctx.putImageData(img, 0, 0);
  el("image", { href: canvas.toDataURL(), x: 0, y: 0, width: PITCH_W, height: PITCH_H, preserveAspectRatio: "none" }, heat);
}

function render() {
  for (const b of document.querySelectorAll("[data-mode]")) b.setAttribute("aria-pressed", b.dataset.mode === mode);
  $("legend").innerHTML = mode === "points"
    ? COLOR_VARS.map((v, i) => `<span><span class="swatch" style="background:var(${v})"></span>${i + 1}${i === 3 ? "+" : ""} touch${i ? "es" : ""}</span>`).join("")
    : `<span>Low</span><span class="ramp"></span><span>High</span>`;
  if (!current) return;
  const heat = drawPitch();
  (mode === "points" ? drawPoints : drawSmooth)(heat, current.points);
}

function parseCsv(text) {
  const [header, ...rows] = text.trim().split("\n");
  const cols = header.split(",");
  return rows.map((line) => {
    const vals = line.split(",").map(Number);
    return Object.fromEntries(cols.map((c, i) => [c, vals[i]]));
  });
}

const pointsCache = new Map();
function fetchPoints(file) {
  if (!pointsCache.has(file)) {
    pointsCache.set(file, fetch(`/data/${encodeURIComponent(file)}`).then((r) => r.text()).then(parseCsv));
  }
  return pointsCache.get(file);
}

// the players actually viewed, in order, with `at` pointing at the current one
let history = [];
let at = -1;

function pushHistory(file) {
  if (history[at] === file) return;
  history = history.slice(0, at + 1);   // a new pick drops anything forward of here
  history.push(file);
  at = history.length - 1;
}

function updateNav() {
  $("prev").disabled = at <= 0;
  $("next").disabled = at >= history.length - 1;
}

function step(dir) {
  const next = at + dir;
  if (next < 0 || next >= history.length) return;
  at = next;
  loadPlayer(history[at], true);
}

let loadToken = 0;
async function loadPlayer(file, fromHistory) {
  const token = ++loadToken;
  if (!fromHistory) pushHistory(file);
  updateNav();
  $("player").value = file;
  const p = players.find((x) => x.file === file);
  loadSimilar(p, token);
  const points = await fetchPoints(file);
  if (token !== loadToken) return;
  current = { player: p, points };

  $("name").textContent = playerName(p);
  $("meta").textContent = `${p.team_name} · ${leagueName(p.league)} · ${p.season_label}`;

  const n = [0, 0, 0, 0];
  for (const pt of points) n[Math.min(pt.count, 4) - 1]++;
  const stat = (v, k, colorVar) =>
    `<div class="stat"><div class="v">${v.toLocaleString()}</div><div class="k">${colorVar ? `<span class="swatch" style="background:var(${colorVar})"></span>` : ""}${k}</div></div>`;
  $("stats").innerHTML =
    stat(p.season_minutes, "season minutes") +
    stat(points.length, "grid points") +
    n.map((c, i) => stat(c, `cells with ${i + 1}${i === 3 ? "+" : ""}`, COLOR_VARS[i])).join("");

  render();
}

const THUMB_W = 210; // thumbnail raster width, px

async function loadSimilar(p, token) {
  const box = $("similar");
  box.innerHTML = "";
  $("similar-sub").textContent = METHODS[method];
  for (const b of document.querySelectorAll("[data-method]")) b.setAttribute("aria-pressed", b.dataset.method === method);
  let matches;
  try {
    const res = await fetch(`/api/similar/${encodeURIComponent(p.player_season_id)}?method=${method}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    matches = await res.json();
  } catch (err) {
    console.error("Failed to load similar players:", err);
    if (token === loadToken) {
      const script = method === "zones" ? "build_similar_zones.py" : "build_similar.py";
      box.innerHTML = `<p class="similar-empty">No similarity data for this method. Run <code>python3 scripts/${script}</code> and restart the server.</p>`;
    }
    return;
  }
  if (token !== loadToken) return;

  for (const m of matches) {
    const q = playersById.get(m.player_season_id);
    if (!q) continue;
    const card = document.createElement("button");
    card.className = "sim-card";
    card.title = `Open ${playerName(q)}`;
    card.innerHTML = `
      <svg viewBox="-1 -1 107 70" xmlns="${SVG_NS}"></svg>
      <div class="sim-top"><span class="sim-name"></span><span class="sim-score"></span></div>
      <div class="sim-meta"></div>`;
    card.querySelector(".sim-name").textContent = `${m.rank}. ${playerName(q)}`;
    card.querySelector(".sim-score").textContent = `${(m.similarity * 100).toFixed(1)}%`;
    card.querySelector(".sim-meta").textContent = `${q.team_name} · ${leagueName(q.league)} · ${q.season_label}`;
    card.addEventListener("click", () => {
      $("search").value = "";
      refreshFilters(q);
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    box.appendChild(card);
    const svg = card.querySelector("svg");
    const heat = drawPitch(svg);
    fetchPoints(q.file).then((points) => {
      if (token !== loadToken) return;
      if (method === "zones") drawZones(heat, points);
      else drawSmooth(heat, points, THUMB_W);
    });
  }
}

async function init() {
  fetch("/api/zones")
    .then((r) => r.json())
    .then((z) => { zoneDefs = z; if (method === "zones" && current) loadSimilar(current.player, loadToken); })
    .catch((err) => console.error("Failed to load /api/zones:", err));
  try {
    const res = await fetch("/api/players");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    players = await res.json();
  } catch (err) {
    console.error("Failed to load /api/players:", err);
    return showStatus("Couldn't load players. Try restarting the server.");
  }
  players = players
    .map((p) => ({
      ...p,
      // the name as shown, which falls back to the slug when we have no name
      searchName: normalize(playerName(p)),
      // everything a player can be reached by, so someone we couldn't name is
      // still findable by slug, club or season
      searchText: normalize([p.first_name, p.last_name, p.player, p.team_name, p.team,
        leagueName(p.league), p.league, p.season_label, p.season].join(" ")),
      // players with no name sort by their slug rather than all clumping first
      sortKey: normalize(p.last_name || p.player),
    }))
    .sort((a, b) => a.sortKey.localeCompare(b.sortKey)
      || a.first_name.localeCompare(b.first_name));
  playersById = new Map(players.map((p) => [p.player_season_id, p]));
  const leagues = Object.keys(LEAGUES).filter((l) => players.some((p) => p.league === l));
  setOptions($("league"), leagues, leagueName, "All leagues");
  $("league").addEventListener("change", () => { $("team").value = ""; refreshFilters(); });
  $("team").addEventListener("change", () => refreshFilters());
  const seasonLabels = new Map(players.map((p) => [p.season, p.season_label]));
  setOptions($("season"), [...seasonLabels.keys()].sort(), (s) => seasonLabels.get(s), "All seasons");
  $("season").addEventListener("change", () => refreshFilters());
  $("search").addEventListener("input", renderSuggestions);
  $("search").addEventListener("focus", () => $("search").value.trim() && renderSuggestions());
  $("search").addEventListener("keydown", onSearchKeydown);
  $("search").addEventListener("blur", closeSuggestions);
  $("player").addEventListener("change", (e) => loadPlayer(e.target.value));
  $("prev").addEventListener("click", () => step(-1));
  $("next").addEventListener("click", () => step(1));
  for (const b of document.querySelectorAll("[data-mode]")) {
    b.addEventListener("click", () => {
      if (mode === b.dataset.mode) return;
      mode = b.dataset.mode;
      try { localStorage.setItem("heatmap-mode", mode); } catch {}
      render();
    });
  }
  for (const b of document.querySelectorAll("[data-method]")) {
    b.addEventListener("click", () => {
      if (method === b.dataset.method) return;
      method = b.dataset.method;
      try { localStorage.setItem("similar-method", method); } catch {}
      if (current) loadSimilar(current.player, loadToken);
    });
  }
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input, select")) return;
    if (e.key === "ArrowLeft") step(-1);
    if (e.key === "ArrowRight") step(1);
  });
  refreshFilters();
}

render();
showStatus("Loading…");
init();
</script>
</body>
</html>
